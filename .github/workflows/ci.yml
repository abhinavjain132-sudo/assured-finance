name: Assured Finance CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
      permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
  with:
    registry: ghcr.io
    username: ${{ github.actor }}
    password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: docker build -t ghcr.io/abhinavjain132-sudo/assured-finance:latest .
      - name: Push Docker image
        run: docker push ghcr.io/abhinavjain132-sudo/assured-finance:latest